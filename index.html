<!DOCTYPE html>
<html lang="ja">
<head>
    <meta property="og:title" content="Discord 軽量化設定チェッカー">
    <meta property="og:description" content="Discordの設定を見直して、快適な環境をチェック。">
    <meta property="og:image" content="https://iz7d.github.io/discord-light/og-image.png">
    <meta property="og:url" content="https://iz7d.github.io/discord-light/">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Discord 軽量化設定チェッカー">
    <meta name="twitter:description" content="Discordの設定を見直して、快適な環境をチェック。">
    <meta name="twitter:image" content="https://iz7d.github.io/discord-light/og-image.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord 軽量化設定</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <h1>Discord 軽量化設定</h1>

    <p class="description">
        Discordの負荷を抑えたい人向けの設定チェックツール
    </p>

    <div class="progress">
        <span id="progressText">0 / 12 完了</span>
        <div class="progress-bar">
            <div id="progressBar"></div>
        </div>
    </div>


    <section class="category">

        <h2>データ＆プライバシー</h2>

        <label class="setting">
            <div>
                <strong>Discordを改善するためにデータを使用</strong>
                <p>推奨設定：OFF</p>
            </div>
            <input type="checkbox" class="check">
        </label>

        <label class="setting">
            <div>
                <strong>データを利用してDiscord体験をパーソナライズしよう</strong>
                <p>推奨設定：ON</p>
            </div>
            <input type="checkbox" class="check">
        </label>

        <label class="setting">
            <div>
                <strong>Discordでのアクティビティを使ってスポンサーコンテンツをパーソナライズします</strong>
                <p>推奨設定：OFF</p>
            </div>
            <input type="checkbox" class="check">
        </label>

    </section>


    <section class="category">

        <h2>システム</h2>

        <label class="setting">
            <div>
                <strong>Discordのシステムトレイに最小化する</strong>
                <p>推奨設定：OFF</p>
            </div>
            <input type="checkbox" class="check">
        </label>

        <label class="setting">
            <div>
                <strong>ハードウェアアクセラレーションを有効化する</strong>
                <p>推奨設定：OFF</p>
            </div>
            <input type="checkbox" class="check">
        </label>

    </section>


    <section class="category">

        <h2>ゲームオーバーレイ</h2>

        <label class="setting">
            <div>
                <strong>オーバーレイを有効にする</strong>
                <p>推奨設定：OFF</p>
            </div>
            <input type="checkbox" class="check">
        </label>

        <label class="setting">
            <div>
                <strong>レガシーオーバーレイを有効にする</strong>
                <p>推奨設定：OFF</p>
            </div>
            <input type="checkbox" class="check">
        </label>

        <label class="setting">
            <div>
                <strong>メッセージ</strong>
                <p>推奨設定：OFF</p>
            </div>
            <input type="checkbox" class="check">
        </label>

        <label class="setting">
            <div>
                <strong>ようこそ</strong>
                <p>推奨設定：OFF</p>
            </div>
            <input type="checkbox" class="check">
        </label>

        <label class="setting">
            <div>
                <strong>Go Live</strong>
                <p>推奨設定：OFF</p>
            </div>
            <input type="checkbox" class="check">
        </label>

        <label class="setting">
            <div>
                <strong>ゲームアクティビティ</strong>
                <p>推奨設定：OFF</p>
            </div>
            <input type="checkbox" class="check">
        </label>

        <label class="setting">
            <div>
                <strong>プレイ中</strong>
                <p>推奨設定：OFF</p>
            </div>
            <input type="checkbox" class="check">
        </label>

    </section>


    <div class="complete">
        <h2>設定が完了したら</h2>
        <p>
            すべてチェックすると、軽量化設定の確認が完了します。
        </p>
    </div>

</main>

<script src="script.js"></script>

</body>
</html>
